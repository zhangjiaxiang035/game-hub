<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 小游戏合集</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>🎮 小游戏合集</h1>
    <p>选一个游戏开始玩吧！</p>
  </header>

  <main class="game-grid">
    <a href="games/tetris.html" class="game-card" style="--accent: #00f5ff;">
      <div class="card-icon">🟦</div>
      <h2>俄罗斯方块</h2>
      <p>经典的方块消除游戏。旋转、移动、消除行，挑战最高分！</p>
      <span class="card-tag">经典</span>
    </a>

    <a href="games/snake.html" class="game-card" style="--accent: #00ff88;">
      <div class="card-icon">🐍</div>
      <h2>贪吃蛇</h2>
      <p>控制小蛇吃食物，越长越长，别撞墙也别咬到自己！</p>
      <span class="card-tag">经典</span>
    </a>

    <div class="game-card placeholder">
      <div class="card-icon">➕</div>
      <h2>更多游戏</h2>
      <p>新游戏即将上线，敬请期待！</p>
      <span class="card-tag">Coming Soon</span>
    </div>
  </main>

  <footer>
    <p>Made with ❤️</p>
  </footer>
</body>
</html>

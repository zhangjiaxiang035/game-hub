<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇 - Snake</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f1a;color:#c0c0d0;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;user-select:none}
.header{width:100%;max-width:520px;padding:12px 16px 4px;display:flex;align-items:center;gap:10px}
.header a{color:#00ff88;text-decoration:none;font-size:14px;padding:4px 10px;border:1px solid #00ff8833;border-radius:6px}
.header h1{font-size:18px;color:#00ff88}
.main{display:flex;flex-direction:column;align-items:center;width:100%;max-width:500px;padding:4px 8px}
#gameCanvas{display:block;background:#0a0a14;border:2px solid #00ff8844;border-radius:6px;max-width:100%;height:auto}
.info{display:flex;gap:16px;justify-content:center;width:100%;padding:6px 0;font-size:14px}
.info span{color:#888}
.info b{color:#00ff88;font-weight:700}
.info .g{color:#ffcc44}
#stat{text-align:center;font-size:12px;color:#00ff8888;padding:2px 0 4px;min-height:18px}
.tc{display:none;gap:4px;padding:4px 0 8px;width:100%;justify-content:center}
.tc.show{display:flex}
.tc-grid{display:grid;grid-template-columns:60px 60px 60px;grid-template-rows:60px 60px 60px;gap:4px}
.tc-btn{background:#1a1a30;border:2px solid #00ff8833;border-radius:10px;color:#00ff88;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tc-btn:active{background:#00ff8822}
.tc-btn.e{border-color:transparent;background:transparent;pointer-events:none}
.tc-btn.p{background:#1a1a30;border-color:#00ff8855}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;align-items:center;justify-content:center}
.overlay.on{display:flex}
.box{background:#1a1a30;border:2px solid #00ff8855;border-radius:16px;padding:28px 32px;text-align:center;max-width:320px;width:90%}
.box h2{font-size:24px;color:#ff4466;margin-bottom:12px}
.box .s{font-size:42px;font-weight:800;color:#00ff88;margin:8px 0}
.box .b{color:#ffcc44;font-size:16px;margin:8px 0 20px}
.box button{background:#00ff88;color:#0f0f1a;font-size:16px;font-weight:700;padding:10px 36px;border:none;border-radius:8px;cursor:pointer}
.pause{display:none;position:fixed;inset:0;background:rgba(10,10,20,0.82);z-index:50;align-items:center;justify-content:center}
.pause.on{display:flex}
.pause span{font-size:28px;font-weight:700;color:#00ff88}
@media(pointer:coarse){.tc{display:flex}}
</style>
</head>
<body>
<div class="header"><a href="../index.html">← 返回</a><h1>🐍 贪吃蛇</h1></div>
<div class="main">
<canvas id="gameCanvas" width="500" height="500"></canvas>
<div class="tc" id="tc">
<div class="tc-grid">
<div class="tc-btn e"></div>
<div class="tc-btn" data-dir="up">▲</div>
<div class="tc-btn e"></div>
<div class="tc-btn" data-dir="left">◀</div>
<div class="tc-btn p" id="tp">⏸</div>
<div class="tc-btn" data-dir="right">▶</div>
<div class="tc-btn e"></div>
<div class="tc-btn" data-dir="down">▼</div>
<div class="tc-btn e"></div>
</div>
</div>
<div style="display:flex;gap:16px;padding:4px 0 2px;font-size:13px">
<span>分数 <b id="sc">0</b></span>
<span>最高 <b class="g" id="best">0</b></span>
<span>等级 <b id="lv">1</b></span>
<span>长度 <b id="len">3</b></span>
</div>
<div id="stat">↑↓←→移动 空格暂停</div>
</div>
<div class="pause" id="pause"><span>⏸ 暂停</span></div>
<div class="overlay" id="modal">
<div class="box">
<div style="font-size:40px">💀</div>
<h2>游戏结束</h2>
<div class="s" id="fs">0</div>
<div style="color:#888;font-size:13px">得分</div>
<div class="b">🏆 最高纪录 <span id="fb">0</span></div>
<button id="rst">🔄 再来一局</button>
</div>
</div>
<script>
(function(){
'use strict';
const CX=document.getElementById('gameCanvas').getContext('2d');
const $=id=>document.getElementById(id);
const se=$('sc'),be=$('best'),le=$('lv'),lne=$('len');
const fs=$('fs'),fb=$('fb'),mo=$('modal'),pa=$('pause'),st=$('stat');
function log(m){st.textContent=m;}
const GR=20,CL=25;
let sn=[],fd={x:8,y:10},dx=1,dy=0,ndx=1,ndy=0;
let sc=0,lv=1,ea=0,ru=0,pa2=0,ov=0;
let li=null,lt=0;
let bs=parseInt(localStorage.getItem('sb')||'0',10);

function ig(){
sn=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];
dx=1;dy=0;ndx=1;ndy=0;
sc=0;lv=1;ea=0;ov=0;pa2=0;
sf();log('✅ 已开始');
}
function sf(){
const s=new Set(sn.map(p=>p.x+','+p.y)),fr=[];
for(let x=0;x<GR;x++)for(let y=0;y<GR;y++)if(!s.has(x+','+y))fr.push({x,y});
if(fr.length)fd=fr[Math.floor(Math.random()*fr.length)];
}
function tk(){
if(pa2||ov)return;
if(!(ndx===-dx&&ndy===-dy)){dx=ndx;dy=ndy;}
const h=sn[0],nh={x:h.x+dx,y:h.y+dy};
if(nh.x<0||nh.x>=GR||nh.y<0||nh.y>=GR){go();return;}
for(let i=0;i<sn.length-1;i++)if(sn[i].x===nh.x&&sn[i].y===nh.y){go();return;}
sn.unshift(nh);
if(nh.x===fd.x&&nh.y===fd.y){sc+=10;ea++;if(ea%5===0)lv=Math.min(lv+1,20);sf();}else sn.pop();
upd();dr();
}
function go(){
ov=1;ru=0;if(li){cancelAnimationFrame(li);li=null;}
if(sc>bs){bs=sc;localStorage.setItem('sb',String(bs));}
fs.textContent=sc;fb.textContent=bs;mo.classList.add('on');
log('💀 游戏结束');
}
function dr(){
CX.clearRect(0,0,500,500);
CX.strokeStyle='#151525';CX.lineWidth=0.5;
for(let i=0;i<=GR;i++){CX.beginPath();CX.moveTo(i*CL,0);CX.lineTo(i*CL,500);CX.stroke();CX.beginPath();CX.moveTo(0,i*CL);CX.lineTo(500,i*CL);CX.stroke();}
const fx=fd.x*CL+CL/2,fy=fd.y*CL+CL/2;
CX.fillStyle='#ff3333';CX.shadowColor='#ff333366';CX.shadowBlur=6;
CX.beginPath();CX.arc(fx,fy,CL*0.4,0,Math.PI*2);CX.fill();CX.shadowBlur=0;
for(let i=sn.length-1;i>=0;i--){
const s=sn[i],sx=s.x*CL,sy=s.y*CL,pad=i===0?1:2,sz=CL-pad*2;
if(i===0){
CX.fillStyle='#33ff99';CX.shadowColor='#33ff9966';CX.shadowBlur=4;
CX.fillRect(sx+pad,sy+pad,sz,sz);CX.shadowBlur=0;
const cx=sx+CL/2,cy=sy+CL/2;let e1x,e1y,e2x,e2y;
if(dx===1){e1x=cx+4;e1y=cy-4;e2x=cx+4;e2y=cy+4;}
else if(dx===-1){e1x=cx-4;e1y=cy-4;e2x=cx-4;e2y=cy+4;}
else if(dy===-1){e1x=cx-4;e1y=cy-4;e2x=cx+4;e2y=cy-4;}
else{e1x=cx-4;e1y=cy+4;e2x=cx+4;e2y=cy+4;}
CX.fillStyle='#fff';CX.beginPath();CX.arc(e1x,e1y,3,0,Math.PI*2);CX.fill();
CX.beginPath();CX.arc(e2x,e2y,3,0,Math.PI*2);CX.fill();
CX.fillStyle='#111';CX.beginPath();CX.arc(e1x,e1y,1.5,0,Math.PI*2);CX.fill();
CX.beginPath();CX.arc(e2x,e2y,1.5,0,Math.PI*2);CX.fill();
}else{const t=i/sn.length;CX.fillStyle='rgb(0,'+Math.max(50,70-t*20+40)+','+Math.max(30,80-t*40)+')';CX.fillRect(sx+pad,sy+pad,sz,sz);}
}
}
function upd(){se.textContent=sc;be.textContent=bs;le.textContent=lv;lne.textContent=sn.length;}
function sd(ndx2,ndy2){
if(ov)return;
if(ndx2===-dx&&ndy2===-dy)return;
ndx=ndx2;ndy=ndy2;
const a=['↑','↓','←','→'],d=[[0,-1],[0,1],[-1,0],[1,0]];
for(let i=0;i<4;i++)if(d[i][0]===ndx2&&d[i][1]===ndy2){log('→ '+a[i]);return;}
}
function tp2(){if(ov)return;pa2=!pa2;pa.classList.toggle('on',pa2);log(pa2?'⏸ 暂停':'▶ 继续');}
function loop(ts){
if(!ru||ov){li=null;return;}
const iv=Math.max(50,150-(lv-1)*8);
if(ts-lt>=iv){lt=ts;tk();}
if(ru&&!ov)li=requestAnimationFrame(loop);
}
function sg(){
if(li){cancelAnimationFrame(li);li=null;}
ig();ru=1;lt=0;
mo.classList.remove('on');pa.classList.remove('on');
dr();upd();li=requestAnimationFrame(loop);
}
document.addEventListener('keydown',function(e){
const k=e.key;
if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))return;
e.preventDefault();
if(k===' '){if(ov)sg();else tp2();return;}
if(pa2||ov)return;
if(k==='ArrowUp')sd(0,-1);
else if(k==='ArrowDown')sd(0,1);
else if(k==='ArrowLeft')sd(-1,0);
else if(k==='ArrowRight')sd(1,0);
});
document.querySelectorAll('.tc-btn[data-dir]').forEach(function(b){
b.addEventListener('click',function(){
const d=this.dataset.dir;
if(d==='up')sd(0,-1);else if(d==='down')sd(0,1);
else if(d==='left')sd(-1,0);else if(d==='right')sd(1,0);
});
b.addEventListener('touchstart',function(e){e.preventDefault();});
});
$('tp').addEventListener('click',function(){if(ov)sg();else tp2();});
$('rst').addEventListener('click',sg);
window.addEventListener('blur',function(){if(ru&&!pa2&&!ov){pa2=1;pa.classList.add('on');log('⏸ 失焦暂停');}});
sg();
})();
</script>
</body>
</html>

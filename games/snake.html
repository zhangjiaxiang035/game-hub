<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇 - Snake</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0f0f1a; color: #c0c0d0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  min-height: 100vh; user-select: none; -webkit-user-select: none;
}
.header {
  width: 100%; max-width: 520px; padding: 16px 20px 8px;
  display: flex; align-items: center; gap: 12px;
}
.header a {
  color: #00ff88; text-decoration: none; font-size: 16px;
  padding: 6px 14px; border: 1px solid #00ff8833; border-radius: 8px;
  transition: background 0.2s;
}
.header a:hover { background: #00ff8815; border-color: #00ff8866; }
.header h1 { font-size: 22px; color: #00ff88; }
.game-wrapper {
  display: flex; flex-wrap: wrap; justify-content: center;
  align-items: flex-start; gap: 20px; padding: 10px 16px 20px;
  max-width: 620px; width: 100%;
}
.board-container {
  position: relative; background: #151528;
  border: 2px solid #00ff8844; border-radius: 8px; padding: 4px;
}
#gameCanvas { display: block; background: #0a0a14; border-radius: 4px; width: 100%; height: auto; image-rendering: pixelated; }
.side-panel { display: flex; flex-direction: column; gap: 14px; min-width: 130px; }
.panel-box { background: #151528; border: 1px solid #00ff8833; border-radius: 8px; padding: 12px; }
.panel-box h3 { font-size: 12px; color: #00ff88aa; margin-bottom: 8px; text-align: center; }
.stat-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
.stat-row .label { color: #8888aa; }
.stat-row .value { font-weight: 700; color: #fff; }
.stat-row .value.score-val { color: #00ff88; font-size: 18px; }
.stat-row .value.best-val { color: #ffcc44; font-size: 16px; }
.instructions { font-size: 12px; color: #666688; line-height: 1.6; text-align: center; }
.instructions kbd { background: #1a1a30; border: 1px solid #333355; border-radius: 4px; padding: 1px 6px; font-size: 11px; font-family: inherit; color: #aaaacc; }
/* Status bar for debugging */
#statusBar {
  text-align: center; font-size: 13px; color: #00ff88; margin-top: 8px;
  background: #1a1a30; border: 1px solid #00ff8833; border-radius: 6px;
  padding: 4px 12px; min-height: 24px;
}
/* Touch controls */
.touch-controls { display: none; width: 100%; max-width: 400px; padding: 8px 16px 24px; justify-content: center; }
.touch-grid { display: grid; grid-template-columns: 80px 80px 80px; grid-template-rows: 80px 80px 80px; gap: 6px; }
.touch-btn { background: #1a1a30; border: 2px solid #00ff8833; border-radius: 14px; color: #00ff88; font-size: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.touch-btn:active { background: #00ff8822; }
.touch-btn.empty { border-color: transparent; background: transparent; pointer-events: none; }
/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.modal-overlay.active { display: flex; }
.modal { background: #1a1a30; border: 2px solid #00ff8855; border-radius: 18px; padding: 36px 40px; text-align: center; max-width: 360px; width: 90%; box-shadow: 0 0 60px #00ff8822; }
.modal h2 { font-size: 28px; color: #ff4466; margin-bottom: 4px; }
.modal .score-display { font-size: 48px; font-weight: 800; color: #00ff88; margin: 12px 0 4px; }
.modal .score-label { color: #8888aa; font-size: 14px; }
.modal .best-score { color: #ffcc44; font-size: 18px; margin: 12px 0 24px; }
.modal .restart-btn { background: #00ff88; color: #0f0f1a; font-size: 18px; font-weight: 700; padding: 12px 40px; border: none; border-radius: 10px; cursor: pointer; }
/* Pause overlay */
.pause-overlay { display: none; position: absolute; inset: 4px; background: rgba(10,10,20,0.82); border-radius: 4px; align-items: center; justify-content: center; z-index: 100; }
.pause-overlay.active { display: flex; }
.pause-overlay span { font-size: 32px; font-weight: 700; color: #00ff88; }
@media (pointer: coarse) { .touch-controls { display: flex; } }
</style>
</head>
<body>
<div class="header">
  <a href="../index.html">← 返回</a>
  <h1>🐍 贪吃蛇</h1>
</div>
<div class="game-wrapper">
  <div class="board-container">
    <canvas id="gameCanvas" width="500" height="500"></canvas>
    <div class="pause-overlay" id="pauseOverlay"><span>⏸ 暂停</span></div>
  </div>
  <div class="side-panel">
    <div class="panel-box">
      <h3>分数</h3>
      <div class="stat-row"><span class="label">当前</span><span class="value score-val" id="scoreDisplay">0</span></div>
      <div class="stat-row"><span class="label">最高</span><span class="value best-val" id="bestDisplay">0</span></div>
    </div>
    <div class="panel-box">
      <h3>速度</h3>
      <div class="stat-row"><span class="label">等级</span><span class="value" id="levelDisplay">1</span></div>
      <div class="stat-row"><span class="label">长度</span><span class="value" id="lengthDisplay">3</span></div>
    </div>
    <div class="panel-box instructions">
      <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 移动 &nbsp;<kbd>空格</kbd> 暂停
    </div>
  </div>
</div>
<div id="statusBar">✅ 游戏已启动，按方向键开始</div>
<div class="touch-controls">
  <div class="touch-grid">
    <div class="touch-btn empty"></div>
    <div class="touch-btn" data-dir="up">▲</div>
    <div class="touch-btn empty"></div>
    <div class="touch-btn" data-dir="left">◀</div>
    <div class="touch-btn" id="touchPause">⏸</div>
    <div class="touch-btn" data-dir="right">▶</div>
    <div class="touch-btn empty"></div>
    <div class="touch-btn" data-dir="down">▼</div>
    <div class="touch-btn empty"></div>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div style="font-size:48px">💀</div>
    <h2>游戏结束</h2>
    <div class="score-display" id="finalScore">0</div>
    <div class="score-label">得分</div>
    <div class="best-score">🏆 最高纪录 <span id="finalBest">0</span></div>
    <button class="restart-btn" id="restartBtn">🔄 再来一局</button>
  </div>
</div>
<script>
(function(){
  'use strict';
  // ---- DOM ----
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const statusBar = document.getElementById('statusBar');
  const scoreEl = document.getElementById('scoreDisplay');
  const bestEl = document.getElementById('bestDisplay');
  const levelEl = document.getElementById('levelDisplay');
  const lenEl = document.getElementById('lengthDisplay');
  const finalScore = document.getElementById('finalScore');
  const finalBest = document.getElementById('finalBest');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const modal = document.getElementById('modalOverlay');
  const restartBtn = document.getElementById('restartBtn');

  function log(msg) { statusBar.textContent = msg; }

  // ---- Constants ----
  const GRID = 20, CELL = 25, TICK_BASE = 150;

  // ---- State ----
  let snake = [];
  let food = {x:8,y:10};
  let dir = {x:1,y:0};      // current direction
  let nextDir = {x:1,y:0};  // queued direction
  let score = 0, level = 1, eaten = 0;
  let running = false, paused = false, over = false;
  let loopId = null, lastTick = 0;
  let best = parseInt(localStorage.getItem('snakeBest')||'0',10);

  // ---- Init ----
  function initGame() {
    snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    score = 0; level = 1; eaten = 0;
    over = false; paused = false;
    spawnFood();
    log("✅ 已开始，按方向键移动");
  }

  function spawnFood() {
    const set = new Set(snake.map(s=>s.x+','+s.y));
    const free = [];
    for (let x=0;x<GRID;x++) for (let y=0;y<GRID;y++) if(!set.has(x+','+y)) free.push({x,y});
    if(free.length) food = free[Math.floor(Math.random()*free.length)];
  }

  // ---- Tick ----
  function tick() {
    if(paused||over) return;
    // apply queued direction (no 180)
    if(!(nextDir.x===-dir.x&&nextDir.y===-dir.y)) dir={x:nextDir.x,y:nextDir.y};
    const head=snake[0], nh={x:head.x+dir.x,y:head.y+dir.y};
    // wall
    if(nh.x<0||nh.x>=GRID||nh.y<0||nh.y>=GRID) { gameOver(); return; }
    // self (exclude tail that will move)
    for(let i=0;i<snake.length-1;i++) if(snake[i].x===nh.x&&snake[i].y===nh.y){gameOver();return;}
    snake.unshift(nh);
    if(nh.x===food.x&&nh.y===food.y){
      score+=10; eaten++;
      if(eaten%5===0) level=Math.min(level+1,20);
      spawnFood();
    } else snake.pop();
    updateUI();
    draw();
  }

  function gameOver() {
    over=true; running=false;
    if(loopId){cancelAnimationFrame(loopId);loopId=null;}
    if(score>best){best=score;localStorage.setItem('snakeBest',String(best));}
    finalScore.textContent=score;
    finalBest.textContent=best;
    modal.classList.add('active');
    log("💀 游戏结束");
  }

  // ---- Draw ----
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='#151525'; ctx.lineWidth=0.5;
    for(let i=0;i<=GRID;i++){
      ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,canvas.height);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(canvas.width,i*CELL);ctx.stroke();
    }
    // food
    const fx=food.x*CELL+CELL/2, fy=food.y*CELL+CELL/2;
    ctx.fillStyle='#ff3333'; ctx.shadowColor='#ff333366'; ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(fx,fy,CELL*0.4,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // snake
    for(let i=snake.length-1;i>=0;i--){
      const s=snake[i], sx=s.x*CELL, sy=s.y*CELL, pad=i===0?1:2, sz=CELL-pad*2;
      if(i===0){
        ctx.fillStyle='#33ff99'; ctx.shadowColor='#33ff9966'; ctx.shadowBlur=6;
        ctx.fillRect(sx+pad,sy+pad,sz,sz); ctx.shadowBlur=0;
        // eyes
        const cx=sx+CELL/2, cy=sy+CELL/2;
        let e1x,e1y,e2x,e2y;
        if(dir.x===1){e1x=cx+4;e1y=cy-4;e2x=cx+4;e2y=cy+4;}
        else if(dir.x===-1){e1x=cx-4;e1y=cy-4;e2x=cx-4;e2y=cy+4;}
        else if(dir.y===-1){e1x=cx-4;e1y=cy-4;e2x=cx+4;e2y=cy-4;}
        else{e1x=cx-4;e1y=cy+4;e2x=cx+4;e2y=cy+4;}
        ctx.fillStyle='#fff'; ctx.beginPath();ctx.arc(e1x,e1y,3,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(e2x,e2y,3,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#111'; ctx.beginPath();ctx.arc(e1x,e1y,1.5,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(e2x,e2y,1.5,0,Math.PI*2);ctx.fill();
      } else {
        const t=i/snake.length;
        ctx.fillStyle=`rgb(0,${Math.max(50,70-t*20+40)},${Math.max(30,80-t*40)})`;
        ctx.fillRect(sx+pad,sy+pad,sz,sz);
      }
    }
  }

  function updateUI() {
    scoreEl.textContent=score; bestEl.textContent=best;
    levelEl.textContent=level; lenEl.textContent=snake.length;
  }

  // ---- Loop ----
  function gameLoop(ts) {
    if(!running||over){loopId=null;return;}
    const interval=Math.max(50,TICK_BASE-(level-1)*8);
    if(ts-lastTick>=interval){lastTick=ts;tick();}
    if(running&&!over) loopId=requestAnimationFrame(gameLoop);
  }

  function startGame(){
    if(loopId){cancelAnimationFrame(loopId);loopId=null;}
    initGame(); running=true; lastTick=0;
    modal.classList.remove('active');
    pauseOverlay.classList.remove('active');
    draw(); updateUI();
    loopId=requestAnimationFrame(gameLoop);
  }

  // ---- Direction ----
  function setDir(dx,dy) {
    if(over) return;
    if(dx===-dir.x&&dy===-dir.y) return; // no 180
    nextDir={x:dx,y:dy};
    log("→ "+(["↑","↓","←","→"].find((_,i)=>[[0,-1],[0,1],[-1,0],[1,0]][i].x===dx&&[[0,-1],[0,1],[-1,0],[1,0]][i].y===dy)));
  }

  function togglePause() {
    if(over) return;
    paused=!paused;
    pauseOverlay.classList.toggle('active',paused);
    log(paused?"⏸ 暂停中":"▶ 继续");
  }

  // ---- KEYBOARD: SINGLE clean handler ----
  document.addEventListener('keydown', function(e) {
    const k=e.key;
    // Only handle our keys
    if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) return;
    e.preventDefault();

    if(k===' ') {
      if(over) startGame();
      else togglePause();
      return;
    }

    if(paused||over) return;

    switch(k) {
      case 'ArrowUp':    setDir(0,-1); break;
      case 'ArrowDown':  setDir(0,1);  break;
      case 'ArrowLeft':  setDir(-1,0); break;
      case 'ArrowRight': setDir(1,0);  break;
    }
  });

  // ---- Touch ----
  document.querySelectorAll('.touch-btn[data-dir]').forEach(b=>{
    b.addEventListener('click',()=>{
      const d=b.dataset.dir;
      if(d==='up') setDir(0,-1);
      else if(d==='down') setDir(0,1);
      else if(d==='left') setDir(-1,0);
      else if(d==='right') setDir(1,0);
    });
    b.addEventListener('touchstart',e=>e.preventDefault());
  });
  document.getElementById('touchPause').addEventListener('click',()=>{
    if(over) startGame(); else togglePause();
  });

  // ---- Restart ----
  restartBtn.addEventListener('click',startGame);

  // ---- Blur ----
  window.addEventListener('blur',()=>{
    if(running&&!paused&&!over){paused=true;pauseOverlay.classList.add('active');log("⏸ 窗口失焦暂停");}
  });

  // ---- GO ----
  startGame();
})();
</script>
</body>
</html>
